[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
# Workspace Crates
cookie = { path = "crates/cookie" }
crypto = { path = "crates/crypto" }
matcher = { path = "crates/matcher" }
pipeline = { path = "crates/pipeline" }
qs = { path = "crates/qs" }
router = { path = "crates/router" }
session = { path = "crates/session" }

# External Dependencies
aes-gcm = "0.11.1"
argon2 = "0.6.0"
base64 = "0.23.1"
bcrypt = "0.19.3"
bytes = "1.12.2"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hmac = "0.13.0"
percent-encoding = "2.3.2"
proptest = "1.12.0"
regex = { version = "1.13.2", default-features = false, features = ["std", "perf"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
time = { version = "0.3.55", default-features = false, features = ["std", "formatting", "parsing"] }
zeroize = "1.9.2"
