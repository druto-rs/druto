[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
# External Dependencies
async-io = "2.6.0"
barta = { git = "https://github.com/Hitarashi/barta.git", branch = "main" }
base64 = "0.23.1"
borno = { git = "https://github.com/Hitarashi/borno.git", branch = "main" }
bytes = "1.12.2"
chirkut = { git = "https://github.com/Hitarashi/chirkut.git", branch = "main" }
dhap = { git = "https://github.com/Hitarashi/dhap.git", branch = "main" }
futures-io = "0.3.34"
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4.3"
gopon = { git = "https://github.com/Hitarashi/gopon.git", branch = "main" }
http = "1.5.0"
jachai = { git = "https://github.com/Hitarashi/jachai.git", branch = "main" }
khonj = { git = "https://github.com/Hitarashi/khonj.git", branch = "main" }
kouta = { git = "https://github.com/Hitarashi/kouta.git", branch = "main" }
mishron = { git = "https://github.com/Hitarashi/mishron.git", branch = "main" }
poribesh = { git = "https://github.com/Hitarashi/poribesh.git", branch = "main" }
poth = { git = "https://github.com/Hitarashi/poth.git", branch = "main" }
router = { package = "druto-router", git = "https://github.com/druto-rs/router.git", branch = "main" }
sebok = { git = "https://github.com/Hitarashi/sebok.git", branch = "main" }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0.154"
session = { package = "druto-session", git = "https://github.com/druto-rs/session.git", branch = "main" }
subtle = "2.6.1"
tokio = { version = "1.54.1", default-features = false }
