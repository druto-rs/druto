[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
regex = { version = "1.13.2", default-features = false, features = ["std", "perf"] }
